<form method="get" class="list-filters" role="search">
    <label class="list-filters-search">
        Search
        <input
            type="search"
            name="q"
            value="{{ filters.q }}"
            placeholder="{{ search_placeholder|default:'Search…' }}"
        >
    </label>

    <div class="list-filters-row">
        {% if category_options %}
            <label>
                Category
                <select name="category">
                    <option value="">All Categories</option>
                    {% for option in category_options %}
                        <option value="{{ option.id }}" {% if filters.category == option.id %}selected{% endif %}>
                            {{ option.name }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        {% if unit_options %}
            <label>
                Unit
                <select name="unit">
                    <option value="">All Units</option>
                    {% for code, label in unit_options %}
                        <option value="{{ code }}" {% if filters.unit == code %}selected{% endif %}>
                            {{ code }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        {% if difficulty_options %}
            <label>
                Difficulty
                <select name="difficulty">
                    <option value="">All</option>
                    {% for code, label in difficulty_options %}
                        <option value="{{ code }}" {% if filters.difficulty == code %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        {% if ingredient_options %}
            <label>
                Ingredient
                <select name="ingredient">
                    <option value="">Any Ingredient</option>
                    {% for option in ingredient_options %}
                        <option value="{{ option.id }}" {% if filters.ingredient == option.id %}selected{% endif %}>
                            {{ option.name }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        {% if tag_options %}
            <label>
                Tag
                <select name="tag">
                    <option value="">Any Tag</option>
                    {% for option in tag_options %}
                        <option value="{{ option.id }}" {% if filters.tag == option.id %}selected{% endif %}>
                            {{ option.name }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        {% if time_options %}
            <label>
                Max Prep Time
                <select name="max_prep">
                    <option value="">Any</option>
                    {% for code, label in time_options %}
                        <option value="{{ code }}" {% if filters.max_prep == code %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </label>
            <label>
                Max Cook Time
                <select name="max_cook">
                    <option value="">Any</option>
                    {% for code, label in time_options %}
                        <option value="{{ code }}" {% if filters.max_cook == code %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </label>
        {% endif %}

        <label>
            Status
            <select name="status">
                <option value="all" {% if filters.status == "all" %}selected{% endif %}>All</option>
                <option value="active" {% if filters.status == "active" %}selected{% endif %}>Active</option>
                <option value="inactive" {% if filters.status == "inactive" %}selected{% endif %}>Inactive</option>
            </select>
        </label>

        <div class="list-filters-actions">
            <button type="submit" class="button">Apply</button>
            {% if filters_active %}
                <a class="button button-ghost" href="{{ clear_url }}">Clear filters</a>
            {% endif %}
        </div>
    </div>
</form>
