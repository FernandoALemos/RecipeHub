{% extends "base.html" %}

{% block title %}{{ heading }} — RecipeHub{% endblock %}

{% block content %}
<div class="page-head">
    <h1>{{ heading }}</h1>
    <a href="{% url 'login' %}">Already have an account? Login</a>
</div>

{% if errors %}
    <ul class="errors">
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post" class="form auth-form">
    {% csrf_token %}
    <label>
        Username
        <input type="text" name="username" value="{{ form.username }}" autocomplete="username" required>
    </label>
    <label>
        Email
        <input type="email" name="email" value="{{ form.email }}" autocomplete="email" required>
    </label>
    <label>
        First name
        <input type="text" name="first_name" value="{{ form.first_name }}" autocomplete="given-name">
    </label>
    <label>
        Last name
        <input type="text" name="last_name" value="{{ form.last_name }}" autocomplete="family-name">
    </label>
    <label>
        Password
        <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>
        Confirm password
        <input type="password" name="confirm_password" autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
</form>
{% endblock %}
