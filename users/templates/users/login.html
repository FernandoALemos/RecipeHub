{% extends "base.html" %}

{% block title %}{{ heading }} — RecipeHub{% endblock %}

{% block content %}
<div class="page-head">
    <h1>{{ heading }}</h1>
    <a href="{% url 'register' %}">Create an account</a>
</div>

{% if errors %}
    <ul class="errors">
        {% for error in errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post" class="form auth-form">
    {% csrf_token %}
    <label>
        Username or email
        <input type="text" name="identifier" value="{{ form.identifier }}" autocomplete="username" required>
    </label>
    <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
    </label>
    {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
    {% endif %}
    <button type="submit">Login</button>
</form>
{% endblock %}
